name: verify

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Run repository contracts
        run: pnpm test
      - name: Run P01 focused suite
        run: pnpm test:p01
      - name: Verify repository status
        run: git status --short
